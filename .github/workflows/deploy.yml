yaml
name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master # Триггер срабатывает при пуше в ветку master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # Папка, куда Create React App собирает готовый сайт
          branch: gh-pages # Ветка, куда экшен отправит готовые файлы
